<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codie</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<header>
  <strong>Codie</strong>
  <span id="status" class="status">…</span>
  <span class="spacer"></span>
  <select id="lang" data-i18n-title="language"><option value="en">English</option><option value="ja">日本語</option><option value="zh">中文</option></select>
  <button id="newTopic" data-i18n="newTopic" data-i18n-title="newTopicTitle" hidden></button>
  <button id="settingsBtn" data-i18n-title="settingsTitle" hidden>⚙</button>
</header>

<section id="setup" hidden>
  <p data-i18n="setupIntro"></p>
  <label><span data-i18n="deviceUrl"></span> <input id="deviceUrl" placeholder="http://192.168.0.39:8081" spellcheck="false"></label>
  <label><span data-i18n="scope"></span> <select id="scope"><option value="session" data-i18n="scopeSession"></option><option value="permanent" data-i18n="scopePermanent"></option></select></label>
  <div class="row"><button id="pairStart" data-i18n="pairStart"></button></div>
  <div id="codeBox" hidden>
    <label><span data-i18n="pairCode"></span> <input id="code" inputmode="numeric" autocomplete="off"></label>
    <div class="row"><button id="pairConfirm" data-i18n="confirm"></button><button id="pairCancel" class="ghost" data-i18n="cancel"></button></div>
  </div>
  <details>
    <summary data-i18n="importSummary"></summary>
    <p class="hint" data-i18n="importHint"></p>
    <textarea id="credsJson" rows="4" placeholder='{"user_id": "...", "local_secret": "...", ...}'></textarea>
    <div class="row"><button id="importCreds" data-i18n="importBtn"></button></div>
  </details>
  <p id="setupError" class="error"></p>
</section>

<section id="settings" hidden>
  <h3 data-i18n="settings"></h3>
  <p id="pairInfo" class="hint"></p>
  <label class="check"><input type="checkbox" id="clearOnNew"> <span data-i18n="clearOnNew"></span></label>
  <label class="check"><input type="checkbox" id="showOlder"> <span data-i18n="showOlder"></span></label>
  <div class="row"><button id="unpair" class="danger" data-i18n="unpair"></button><button id="settingsClose" class="ghost" data-i18n="close"></button></div>
</section>

<main id="chat" hidden>
  <div id="log" aria-live="polite"></div>
  <div id="turnStatus" class="turn-status" hidden><span id="turnText"></span><button id="cancelTurn" class="ghost" data-i18n="stop"></button></div>
  <div id="attachment" class="attachment" hidden><img id="thumb" alt=""><span id="attachInfo"></span><button id="removeAttach" class="ghost" data-i18n-title="removeAttach">×</button></div>
  <div id="error" class="error"></div>
  <form id="composer">
    <textarea id="input" rows="2" data-i18n-ph="placeholder"></textarea>
    <div class="row">
      <button type="button" id="shot" data-i18n="shot" data-i18n-title="shotTitle"></button>
      <span class="spacer"></span>
      <button type="submit" id="send" data-i18n="send"></button>
    </div>
  </form>
</main>
<script type="module" src="sidepanel.js"></script>
</body>
</html>
